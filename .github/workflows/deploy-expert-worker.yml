# version 1.1
name: Deploy Ai-Sistem runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/expert-worker/**"
      - "supabase/functions/ai-provider-worker/**"
      - "supabase/functions/result-aggregator/**"
      - ".github/workflows/deploy-expert-worker.yml"
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: poenmzpdeykvstlfyxgg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy expert-worker
        run: supabase functions deploy expert-worker --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy ai-provider-worker
        run: supabase functions deploy ai-provider-worker --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy result-aggregator
        run: supabase functions deploy result-aggregator --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
